name: Release

# Pushing a vX.Y.Z tag builds the four python.tar.gz release tarballs, each on
# a runner of its own OS and architecture, and publishes them to the prod CDN
# only after all four build and pass `make test`. Tags with any other shape
# (v1.2.3-rc1, v1.2, ...) do not match the filter and never run this workflow.
#
# Running it manually (workflow_dispatch) is a dry run: it builds and tests
# all four targets with ad-hoc macOS signing, needs no secrets, and publishes
# nothing. The tarballs are kept as run artifacts.
#
# Secrets and variables live in the `release` environment, restricted to v*
# tags.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BLUECTL_VERSION: v1.85.1

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    if: github.repository == 'unstablebuild/rune-language-python'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Only signed macOS builds need secrets; Linux builds and dry runs use none.
    environment: ${{ (github.event_name == 'push' && matrix.os == 'darwin') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Each tarball is built natively; refuse a runner of the wrong arch.
      - name: Check runner architecture
        run: |
          case "$(uname -m)" in
            x86_64) host=amd64 ;;
            arm64 | aarch64) host=arm64 ;;
            *) host="$(uname -m)" ;;
          esac
          if [ "$host" != "$TARGET_ARCH" ]; then
            echo "::error::runner is $host, expected $TARGET_ARCH"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: rune/go.mod
          cache-dependency-path: rune/go.sum

      - name: Install macOS build tools
        if: matrix.os == 'darwin'
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          command -v wget >/dev/null || brew install wget

      - name: Build and test (Linux)
        if: matrix.os == 'linux'
        run: make python.tar.gz test

      - name: Build and test (macOS dry run, ad-hoc signed)
        if: matrix.os == 'darwin' && github.event_name != 'push'
        run: make python.tar.gz test CODESIGN_IDENTITY=-

      - name: Import signing and notarization credentials
        if: matrix.os == 'darwin' && github.event_name == 'push'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # Prepend to the search list; xargs unquotes the existing entries.
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          umask 077
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize and test (macOS)
        if: matrix.os == 'darwin' && github.event_name == 'push'
        env:
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          make notarize python.tar.gz test \
            NOTARY_AUTH="--key $RUNNER_TEMP/notary-key.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER"

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.arch }}
          path: python.tar.gz
          if-no-files-found: error
          retention-days: 30

  # One job per target, so a failed upload can be re-run on its own: published
  # versions are immutable and bluectl refuses to upload one twice.
  publish:
    name: Publish (${{ matrix.target }})
    needs: build
    if: github.event_name == 'push' && github.repository == 'unstablebuild/rune-language-python'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
    steps:
      # dist.sh reads the tag and the commit log since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z tag"
            exit 1
          fi
          described="$(git describe --tags --exact-match HEAD)"
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe reports $described, expected $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: ${{ runner.temp }}/dist

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install bluectl
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/unstablebuild/blue/cmd/bluectl@$BLUECTL_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Upload to the prod CDN
        env:
          PGP_KEYRING: ${{ secrets.BLUE_PGP_KEYRING }}
          BLUE_PGP_KEY: ${{ vars.BLUE_PGP_KEY }}
          BLUE_PGP_PASSPHRASE: ${{ secrets.BLUE_PGP_PASSPHRASE }}
        run: |
          umask 077
          export BLUE_PGP_KEYRING="$RUNNER_TEMP/keyring.asc"
          printf '%s\n' "$PGP_KEYRING" > "$BLUE_PGP_KEYRING"
          make "upload-prod-${{ matrix.target }}" TAR="$RUNNER_TEMP/dist/python.tar.gz"